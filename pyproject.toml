[build-system]
# 用 hatchling：src 布局开箱即用，且它不把「打包」和「依赖解析」绑在一起。
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "changqing"
version = "0.1.0"
description = "Long-lived memory for companion AI: layered, model-consolidated, traceable."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "JasonBuildAI" }]
keywords = ["memory", "llm", "agent", "companion", "retrieval", "chinese"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

# 核心**零第三方依赖**：存储、抽取、检索、梳理全用标准库写成。
# 下面每一组都是可选能力，按需装；只装核心也能跑（离线 mock 适配器）。
dependencies = []

[project.optional-dependencies]
# OpenAI 兼容的嵌入与对话模型适配器。
openai = ["httpx>=0.27"]
# 可挂载的 FastAPI 路由（`changqing.server`）。
server = ["fastapi>=0.110", "pydantic>=2.6", "uvicorn>=0.27"]
# 中文分词。缺失时自动退化成字符 bigram：召回略降，功能不变。
chinese = ["jieba>=0.42"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "httpx>=0.27",
  "fastapi>=0.110",
  "pydantic>=2.6",
]
all = [
  "httpx>=0.27",
  "fastapi>=0.110",
  "pydantic>=2.6",
  "uvicorn>=0.27",
  "jieba>=0.42",
]

[project.urls]
Homepage = "https://github.com/JasonBuildAI/changqing"
Repository = "https://github.com/JasonBuildAI/changqing"
Issues = "https://github.com/JasonBuildAI/changqing/issues"
Changelog = "https://github.com/JasonBuildAI/changqing/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/changqing"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "benchmarks", "README.md", "README.en.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes，I = import 排序，UP = pyupgrade，
# B = bugbear，SIM = 可简化写法，RUF = ruff 自己的规则集。
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]
ignore = [
  # 中文注释与文档字符串行宽天然偏长，交给 line-length 而不是 E501 逐行判。
  "E501",
  # RUF00x 是「易混字符」检查（把全角「，」当成英文逗号的形近字符）。本库
  # 中文优先，文档字符串与注释里的全角标点是**正确写法**，不是笔误 ——
  # 它该盯的是代码里的形近字符，这里没有代码用了全角标点。
  "RUF001",
  "RUF002",
  "RUF003",
  # 本库的 "__all__" 按层分组（L0 / L1 / …），分组本身是给人读的排序。
  "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# 测试里到处是「先断言再构造」的写法，SIM 的合并建议只会让断言更难读。
"tests/**" = ["SIM"]

[tool.ruff.lint.isort]
# src 布局下把自己的包标成 first-party，否则会被当成第三方排到别处。
known-first-party = ["changqing"]

[tool.mypy]
python_version = "3.10"
files = ["src/changqing"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
# 不要求每个函数都写类型：这个库里有大量「内部小工具」，先把**行为**的类型
# 钉住比追求 100% 覆盖率更值。等接口冻结后再考虑打开 disallow_untyped_defs。
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# jieba 没有类型存根，且是可选依赖（见 [project.optional-dependencies]）。
module = ["jieba.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-m 'not online' -q"
markers = [
  "online: 需要真实 API Key 与网络（含真实模型）；默认档不选它",
  "slow: 墙钟阈值型断言（负载下会抖）；默认档不选它",
]

[tool.coverage.run]
branch = true
source = ["src/changqing"]
omit = ["src/changqing/server/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
